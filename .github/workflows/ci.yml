name: CI

on:
  push:
    branches: [main]
    paths: ["spike/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["spike/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: setup (checkout + install) dominates runtime on the free tier,
  # so parallel jobs would double the bill for seconds of feedback.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: spike/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: spike/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp test

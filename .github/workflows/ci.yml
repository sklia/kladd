name: CI

on:
  push:
    branches: [main]
    paths: ["spike/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["spike/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: spike

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: spike/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: spike/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: spike/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: spike/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp test
